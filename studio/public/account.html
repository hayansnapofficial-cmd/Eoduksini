<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>내 계정 · 어둑시니</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/account.css">
</head>
<body class="account-page">
  <header class="site-nav"><a class="wordmark" href="/">어둑시니 <span>EODUKSINI</span></a><nav><a id="admin-link" class="nav-link hidden" href="/admin">관리자</a><button id="logout" class="text-button">로그아웃</button></nav></header>
  <main class="account-main">
    <div class="account-heading"><p class="eyebrow">ACCOUNT & ACCESS</p><h1>내 계정</h1><p id="identity" class="muted">계정 정보를 불러오는 중입니다.</p><p id="organization" class="organization-line"></p></div>
    <section class="subscription-card">
      <div><p class="eyebrow">CURRENT ACCESS</p><h2 id="plan-title">구독 확인 중</h2><div id="plan-detail">서버가 확인한 권한만 Studio 접근에 반영됩니다.</div></div>
      <span id="plan-status" class="plan-status">—</span>
      <div id="plan-picker" class="plan-picker" aria-labelledby="plan-picker-title">
        <div class="section-heading"><p class="eyebrow">CHOOSE A PLAN</p><h3 id="plan-picker-title">작업 방식에 맞는 플랜</h3></div>
        <div id="plans" class="plan-grid"></div>
      </div>
      <div id="phone-field" class="payment-field"><label for="phone">결제자 휴대전화 번호</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-1234-5678"><small>PayApp 결제 요청에만 전달하며 어둑시니에는 저장하지 않습니다.</small></div>
      <div class="subscription-actions"><button id="subscribe" class="primary-action" type="button">선택한 플랜 구독</button><a id="studio" class="primary-action hidden" href="/studio">Studio 열기</a></div>
      <p id="account-message" class="form-message" role="status"></p>
    </section>
    <section class="trust-strip"><div><b>GitHub</b><span>계정 인증</span></div><div><b>PayApp</b><span>구독 검증</span></div><div><b>Controller</b><span>실행 기록</span></div></section>
  </main>
  <script type="module" src="/account.js"></script>
</body>
</html>
